name: Keep Supabase alive
# Chỉ cần khi deploy production dùng Supabase (free tự pause sau 7 ngày).
# Local dev dùng SQLite nên không cần.
on:
  schedule:
    - cron: "0 0 */5 * *" # Mỗi 5 ngày
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/Book?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
